[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-risc-reference"
version = "0.1.0"
description = "Agentic RISC reference fixture"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "cryptography>=43,<51", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
agentic-risc-runtime = "agentic_risc.api:main"
agentic-risc-actor = "agentic_risc.actor:main"

[tool.setuptools.packages.find]
include = ["agentic_risc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
