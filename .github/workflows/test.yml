name: Research fixture conformance
on: [push, pull_request]
jobs:
  conformance:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap python3
      - run: make install
      - run: make test
      - run: make build
      - name: Execute and verify C8-C10 coverage schedules
        run: .venv/bin/python scripts/reproduce_coverage.py --checks none --output .runtime/ci-coverage
      - name: Preserve coverage observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-observations
          path: .runtime/ci-coverage/
          retention-days: 30
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Browser tests
        timeout-minutes: 10
        run: cd frontend && npm test -- --reporter=list --max-failures=1
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7
