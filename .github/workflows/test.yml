name: Research fixture conformance
on: [push, pull_request]
jobs:
  conformance:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap python3
      - run: make install
      - run: make test
      - run: make build
      - run: cd frontend && npx playwright install --with-deps chromium && npm test
